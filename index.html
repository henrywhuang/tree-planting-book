<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8dfd2" />
    <meta
      name="description"
      content="和1号一起打开剪纸立体书，种树、数间隔，发现两端植树的数学秘密。"
    />
    <title>两端植树 · 1号的数学立体书</title>
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/fonts/board.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="brand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 5c4-1 6 0 9 2 3-2 5-3 9-2v14c-4-1-6 0-9 2-3-2-5-3-9-2zM12 7v14"
            />
          </svg>
          <span>1号的数学立体书</span>
        </div>
        <span id="chapter-label" class="chapter-label">两端植树</span>
        <nav class="toolbar" aria-label="小书工具">
          <button
            id="sound-btn"
            class="icon-button"
            type="button"
            aria-label="关闭声音"
            title="声音"
          ></button>
          <button
            id="captions-btn"
            class="icon-button"
            type="button"
            aria-label="显示1号的字幕"
            aria-pressed="false"
            title="字幕"
          ></button>
          <button
            id="reset-btn"
            class="icon-button"
            type="button"
            aria-label="重做这一组"
            title="重做"
            disabled
          ></button>
          <button
            id="menu-btn"
            class="icon-button"
            type="button"
            aria-label="打开书签"
            aria-expanded="false"
            aria-controls="menu"
            title="书签"
          ></button>
        </nav>
      </header>
      <main id="stage" aria-label="可以操作的剪纸立体书">
        <canvas
          id="book-view"
          role="img"
          aria-label="1号陪你种树、数段"
        ></canvas>
        <div id="hotspots" aria-label="书页互动"></div>
        <canvas id="trail" aria-hidden="true"></canvas>
        <button id="ip-callout" type="button" hidden>点我，试试</button>
        <div id="speech-bubble" hidden></div>
        <div id="song-caption" hidden><div id="song-line"></div></div>
        <p id="task-hint" class="task-hint" hidden></p>
        <button id="next-step" class="next-step" type="button" hidden>
          继续 <span aria-hidden="true">→</span>
        </button>
        <div id="song-controls" class="song-controls" hidden>
          <button id="song-pause" type="button">暂停儿歌</button>
          <button id="song-end" type="button">结束</button>
        </div>
        <p
          id="a11y-status"
          class="sr-only"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>
      </main>
      <aside
        id="menu"
        class="bookmark-menu"
        aria-labelledby="menu-title"
        hidden
      >
        <div class="menu-heading">
          <h2 id="menu-title">我的小书签</h2>
          <button id="menu-close" type="button" aria-label="关闭书签">×</button>
        </div>
        <div id="chapter-list"></div>
        <button id="restart-btn" class="restart-button" type="button">
          从头种一条小路 <span aria-hidden="true">↻</span>
        </button>
        <p id="storage-note" class="small">
          点1号可以重听引导。<br />进度保存在这台设备。
        </p>
      </aside>
      <div id="loading" role="status">
        <div class="loader-book" aria-hidden="true">
          <span></span><span></span>
        </div>
        <strong>1号和小书正在准备…</strong>
        <p id="load-detail">马上就可以种树啦</p>
        <button id="retry-btn" type="button" hidden>重新打开小书</button>
      </div>
      <noscript>请开启 JavaScript，和1号一起打开互动立体书。</noscript>
    </div>
    <script type="module" src="./src/boot.js"></script>
  </body>
</html>
